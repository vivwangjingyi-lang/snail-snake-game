<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="贪吃蛇网页游戏 - 经典玩法，现代体验">
    <title>{% block title %}贪吃蛇{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 自定义 Tailwind 配置 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // 深色主题颜色
                        'dark-bg': '#121212',
                        'dark-card': '#1E1E1E',
                        'dark-border': '#2D2D2D',
                        // 游戏主题色
                        'snake-green': '#00FF41',
                        'food-red': '#FF4136',
                        'accent-cyan': '#00D9FF',
                        // 文字颜色
                        'text-primary': '#FFFFFF',
                        'text-secondary': '#B0B0B0',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'bounce-soft': 'bounceSoft 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 5px #00FF41, 0 0 10px #00FF41' },
                            '50%': { boxShadow: '0 0 20px #00FF41, 0 0 30px #00FF41' },
                        },
                        bounceSoft: {
                            '0%': { transform: 'scale(0.9)' },
                            '50%': { transform: 'scale(1.05)' },
                            '100%': { transform: 'scale(1)' },
                        },
                    },
                },
            },
        }
    </script>
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-bg text-text-primary min-h-screen">
    {% block content %}{% endblock %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
